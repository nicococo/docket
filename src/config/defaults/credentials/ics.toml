# Plain ICS/webcal feed credentials — read-only, no OAuth, no CalDAV
# discovery. Each [[feeds]] entry is just a URL.
#
# Google Calendar: gear icon → Settings → click a calendar under "Settings
# for my calendars" → scroll to "Integrate calendar" → copy the "Secret
# address in iCal format" URL. Only available for calendars you own.
# Note: Google only regenerates that feed every few hours server-side, so
# events lag behind reality — use the OAuth `google` provider instead if
# you need near-real-time updates.
#
# Any other calendar that publishes a public or secret .ics export
# (Outlook.com, Fastmail, a shared team calendar, …) works the same way.
#
# `label` matches this feed to a `[[providers]]` block in calendar.toml
# via that block's `account` field. Omit `account` there (or set it to
# "default") to match a feed labeled "default" below.

[[feeds]]
label = "default"
url = "REPLACE_WITH_YOUR_SECRET_ICS_URL"
