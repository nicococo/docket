id = "nicococo.docket"
name = "docket"
version = "0.4.0"
min_herdr_version = "0.9.0"
description = "Calendar, feeds, notes and email in one terminal dashboard."
platforms = ["linux", "macos"]

[[build]]
command = ["cargo", "build", "--release", "--locked"]

[[build]]
command = ["python3", "scripts/install-herdr.py", "--register-shortcut-only"]

[[panes]]
id = "dashboard"
title = "docket"
placement = "overlay"
command = ["./target/release/docket"]

[[actions]]
id = "toggle"
title = "Toggle docket"
description = "Open, focus or close the docket dashboard."
command = ["python3", "scripts/herdr-toggle.py"]
