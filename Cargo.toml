[package]
name = "docket-tui"
version = "0.5.1"
edition = "2021"
description = "Quick-glance terminal dashboard and shared Markdown memory for people and coding agents across projects and machines"
license = "GPL-3.0-or-later"
repository = "https://github.com/nicococo/docket"
keywords = ["tui", "dashboard", "terminal", "productivity", "ratatui"]
categories = ["command-line-interface"]

# The package crate is `docket-tui` (kept for crates.io publishing), but the
# produced binary is just `docket` — that's what ships to $PATH and what the
# user types to launch the dashboard.
[[bin]]
name = "docket"
path = "src/main.rs"

# ── Widget features ──────────────────────────────────────────────────────────
# Each widget compiles in only when its feature is enabled. `default` aliases
# the `widgets-all` umbrella so a plain `cargo install docket-tui` ships with
# every widget — the slim-build path is available for downstream packagers
# (and binary-size-sensitive deployments) via `--no-default-features` plus a
# hand-picked subset.
#
# Adding a new widget is purely additive: declare its feature here, include
# it in the `widgets-all` umbrella, add the WidgetDescriptor in
# src/widgets/registry.rs, and the build tree picks it up.
[features]
default = ["widgets-all"]

# Each widget gates its widget-exclusive dependencies through the matching
# `dep:` entry below, so `--no-default-features --features "widget-calendar"`
# really does compile out everything email / news / etc. pull in. Shared
# infra (chrono, reqwest, tokio, ratatui, anyhow, serde, …) stays
# unconditional — gating it would either need every widget to opt in or
# break the runtime, neither of which is worth the LOC.
widget-calendar = ["dep:roxmltree", "dep:ical"]
widget-email = ["dep:imap", "dep:native-tls", "dep:mail-parser", "dep:html2text"]
widget-notes = []
# Hosts the tabbed multi-source RSS reader.
widget-feeds = ["dep:feed-rs"]
widgets-all = [
  "widget-calendar",
  "widget-email",
  "widget-notes",
  "widget-feeds",
]

[dependencies]
# TUI
ratatui = "0.28"
crossterm = { version = "0.28", features = ["event-stream"] }

# Async. We pull only what we use: `rt-multi-thread` for the runtime +
# `spawn_blocking` / `block_in_place` (sync IMAP);
# `macros` for `#[tokio::main]` / `#[tokio::test]` / `join!` / `select!`;
# `net` + `io-util` for the OAuth loopback TCP listener; `time` for
# polling intervals + per-request timeouts; `sync` for the mpsc channels.
# Dropping the `"full"` feature shaves the unused fs/process/signal
# subsystems and ~5 transitive crates.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }

# HTTP & serialization
# `gzip`/`brotli`/`deflate` + `http2` so the shared HTTP client can
# accept the same Accept-Encoding set a real browser advertises and
# negotiates HTTP/2 — Cloudflare-fronted news feeds (CTV, Barron's,
# CBC) reject HTTP/1.1 + identity-encoding requests as automation
# even when the User-Agent is browser-shaped.
reqwest = { version = "0.12", features = ["json", "cookies", "gzip", "brotli", "deflate", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.22"

# Date/time
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.9"

# Utilities
anyhow = "1"
async-trait = "0.1"
futures = "0.3"
open = "5"
urlencoding = "2"
feed-rs = { version = "2", optional = true }   # widget-feeds
roxmltree = { version = "0.20", optional = true } # widget-calendar (CalDAV provider)
ical = { version = "0.11", optional = true }     # widget-calendar (CalDAV provider)
getrandom = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
notify = "6"
# Terminal cell width for unicode strings — needed for any column-width
# math against text that can contain CJK / emoji / wide glyphs (where
# `chars().count()` no longer matches what the terminal renders).
unicode-width = "0.1"
dirs = "5"
clap = { version = "4", features = ["derive"] }

# Direct OS clipboard access. We try this before falling back to OSC 52
# in `crate::clipboard::copy` — OSC 52 depends on terminal-specific
# config (off by default in iTerm2/Alacritty, unsupported in Terminal.app)
# and a "yank" that never actually reaches the system clipboard makes
# Cmd+V silently paste stale content.
#
# `wayland-data-control` is NOT in arboard's default features — without
# it, Linux clipboard access goes through x11rb only, which depends on
# XWayland bridging the clipboard on a pure-Wayland compositor (Hyprland,
# Sway, …) and can silently fail there. That failure is invisible to the
# user: `crate::clipboard::copy` falls back to OSC 52, which "succeeds"
# by writing escape bytes to stdout regardless of whether the terminal
# actually forwards them — so the footer says "Copied to clipboard" even
# though nothing landed on the real clipboard. This feature adds a
# second Linux backend (wl-clipboard-rs, talking directly to the
# compositor's wlr-data-control protocol) that arboard tries first on
# Wayland, sidestepping the XWayland dependency entirely.
arboard = { version = "3", features = ["wayland-data-control"] }

# IMAP support for the Email widget's IMAP provider (third option
# alongside Gmail OAuth and Outlook OAuth). The sync `imap` crate is
# the mature option; we run its calls under `tokio::task::spawn_blocking`
# so the wider async runtime isn't held up. `mail-parser` parses RFC
# 5322 message bodies (To/From/Subject/text) once IMAP delivers them.
imap = { version = "2", optional = true }
native-tls = { version = "0.2", optional = true }
mail-parser = { version = "0.9", optional = true }
# Robust HTML → text rendering for email bodies (widget-email). Pure,
# in-process (no network): parses the message's HTML part with the
# html5ever tree builder and renders terminal-friendly text — dropping
# comments/script/style, decoding the full entity set, and formatting
# lists, links, blockquotes, and headings. Replaces the hand-rolled
# `html_strip` fallback that leaked MSO-conditional comments and
# undecoded entities.
html2text = { version = "0.12", optional = true }

[dev-dependencies]
wiremock = "0.6"
tokio-test = "0.4"
